<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RepairDesk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                <span class="text-blue-600">Repair</span>Desk
            </h1>
            <p class="text-gray-500 mt-2">Enterprise Repair Management</p>
        </div>
        
        {% if form.errors %}
        <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
            <p class="text-red-600 text-sm">Invalid username or password. Please try again.</p>
        </div>
        {% endif %}

        <div class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg space-y-3">
            <p class="text-blue-800 text-sm font-semibold">Demo Access</p>
            <div class="flex items-center gap-2">
                <span class="text-sm text-gray-700 w-24">Username</span>
                <input id="demo-username" type="text" value="tester" readonly
                       class="flex-1 px-3 py-2 border border-blue-200 rounded-md text-sm bg-white text-gray-800">
                <button type="button" onclick="copyCredential('demo-username')"
                        class="px-3 py-2 text-sm font-medium bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                    Copy
                </button>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-sm text-gray-700 w-24">Password</span>
                <input id="demo-password" type="text" value="testing419" readonly
                       class="flex-1 px-3 py-2 border border-blue-200 rounded-md text-sm bg-white text-gray-800">
                <button type="button" onclick="copyCredential('demo-password')"
                        class="px-3 py-2 text-sm font-medium bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">
                    Copy
                </button>
            </div>
        </div>
        
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                <input type="text" 
                       name="username" 
                       id="id_username" 
                       required 
                       autofocus
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                       placeholder="Enter your username">
            </div>
            
            <div>
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" 
                       name="password" 
                       id="id_password" 
                       required
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                       placeholder="Enter your password">
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition font-medium">
                Sign In
            </button>
        </form>
        
        <p class="mt-6 text-center text-gray-500 text-sm">
            RepairDesk Enterprise Edition v1.0
        </p>
    </div>

    <script>
        function copyCredential(inputId) {
            const input = document.getElementById(inputId);
            if (!input) {
                return;
            }

            input.select();
            input.setSelectionRange(0, 99999);

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(input.value);
            } else {
                document.execCommand('copy');
            }
        }
    </script>
</body>
</html>
